# 复制成 config.yaml 再改。示例：宁波吉登（电动牙刷）在海外 AI 里的可见度。

brand:
  name: JIDENG
  aliases: ["JIDENG", "Jideng", "吉登", "Ningbo Jideng"]   # 回答里可能出现的写法
  domains: ["cnjideng.com"]                               # 官网域名，用来判断"官网是否被 AI 引用"

competitors:
  - name: Philips
    aliases: ["Philips", "Sonicare", "飞利浦"]
  - name: Oral-B
    aliases: ["Oral-B", "欧乐B"]
  - name: Shenzhen Risun
    aliases: ["Risun", "瑞圣"]
  - name: Baolijie
    aliases: ["Baolijie", "宝丽洁"]
  - name: Yinglang
    aliases: ["Yinglang", "英朗"]

# 采购商可能会问 AI 的问题。category 对应爱搜的"问题类型"。
questions:
  - text: "Who are the most reliable electric toothbrush OEM manufacturers in China?"
    category: 求推荐
  - text: "I want to launch a private label sonic toothbrush brand. Which Chinese factory should I work with?"
    category: 求推荐
  - text: "Best China supplier for electric toothbrushes with ISO13485 and FDA registration?"
    category: 求推荐
  - text: "How do I choose an electric toothbrush factory in China, and which ones are worth contacting?"
    category: 求助/解决
  - text: "电动牙刷代工厂哪家好？"
    category: 求推荐

# 同一个问题问几次。AI 每次回答都不一样，次数越多结果越稳，费用也越高。
samples: 3

# 只有设置了对应 API Key（环境变量）的平台才会真正运行。
platforms:
  - id: chatgpt
    label: ChatGPT
    type: openai           # OPENAI_API_KEY
    model: gpt-5
  - id: perplexity
    label: Perplexity
    type: perplexity       # PERPLEXITY_API_KEY
    model: sonar
  - id: gemini
    label: Gemini
    type: gemini           # GEMINI_API_KEY
    model: gemini-2.5-flash
  - id: claude
    label: Claude
    type: claude           # ANTHROPIC_API_KEY
    model: claude-opus-5-5
  # 国内平台（做国内市场时打开）
  # - id: doubao
  #   label: 豆包
  #   type: doubao_bot     # ARK_API_KEY；model 填火山方舟里开了"联网"插件的应用 ID
  #   model: bot-xxxxxxxx
  # - id: qwen
  #   label: 千问
  #   type: qwen           # DASHSCOPE_API_KEY
  #   model: qwen-plus
  # - id: deepseek
  #   label: DeepSeek
  #   type: deepseek       # DEEPSEEK_API_KEY（API 不联网，只反映模型记忆）

judge_model: claude-opus-5-5      # --judge 时用来识别全部品牌和情感倾向
results_file: data/results.jsonl
